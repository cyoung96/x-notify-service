[package]
name = "x-notify-service"
version = "0.1.0"
edition = "2024"
publish = ["crates-io"]
description = "跨平台消息通知服务:浏览器调用 → 右下角置顶弹窗(系统通知兜底)"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
notify-rust = "4"
flexi_logger = "0.31"
log = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
fd-lock = "4"
auto-launch = "0.6"
slint = { version = "1", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-software",
    "backend-winit",
] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSScreen"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
