# Release:打 v* 标签 → 三平台打包 → 发布到 GitHub Releases
# 正式发版流程:测试由 ci.yml 在 main 上把关,这里只做打包与发布
#
# 产物:Linux tar.xz(x86_64/aarch64)+ Windows NSIS setup.exe
# 说明:Linux 在 Debian 10 容器内编译(glibc 2.28 地板,兼容 UOS 20/麒麟 V10
#       等老 glibc 系统,产出可跑在 ≥2.28 的所有发行版);脚本自带 GLIBC 断言。
#       linux-aarch64 使用 GitHub 原生 arm64 runner(公开仓库免费;
#       私有仓库如无 arm64 配额,可改用 ubuntu-24.04 + docker/setup-qemu-action)

name: release

on:
  push:
    tags: ['v*']

# 最小权限基线:publish job 覆盖为 contents: write
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ci-cache
          key: linux-x86_64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-x86_64-cargo-
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@10
      - run: ./scripts/pack-linux.sh x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-tarxz
          path: dist/*.tar.xz

  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ci-cache
          key: linux-aarch64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-aarch64-cargo-
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@10
      - run: ./scripts/pack-linux.sh aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-tarxz
          path: dist/*.tar.xz

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 nsis
      - run: rustup target add x86_64-pc-windows-gnu
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@10
      - run: ./scripts/pack-windows.sh x86_64-pc-windows-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup-exe
          path: dist/*.exe

  publish:
    needs: [linux-x86_64, linux-aarch64, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # 已发布(tag 不可变):拒绝覆盖;草稿(上次中断):续传;不存在:新建草稿
          STATE=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$STATE" = "false" ]; then
            echo "::error::Release $TAG 已发布,拒绝覆盖——标签不可变,变更请升版本号打新 tag"
            exit 1
          fi
          if [ "$STATE" = "none" ]; then
            gh release create "$TAG" --draft \
            --title "x-notify-service $TAG" \
            --notes "正式发布 $TAG · commit ${GITHUB_SHA::8} · $(date -u '+%Y-%m-%d %H:%M UTC')

          #### 产物
          - Linux x86_64 / aarch64: tar.xz 绿色版(解压后 ./install.sh,免 root)
          - Windows: setup.exe(per-user 免 UAC)

          #### 验证
          \`\`\`bash
          md5sum bin/x-notify-service   # 与 Release 说明或下发渠道核对
          x-notify-service info         # 诊断快照(工作区/落点/注册状态)
          x-notify-service notify -t \"手测\"
          \`\`\`
          安装与接入见包内 sdk-使用手册.md。" \
            -R "$GITHUB_REPOSITORY" \
              dist/*.tar.xz dist/*.exe
          else
            gh release upload "$TAG" dist/*.tar.xz dist/*.exe --clobber
          fi
          gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
