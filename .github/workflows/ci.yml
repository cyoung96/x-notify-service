# CI:主分支质量门禁
# 门禁:clippy 最严格检查 → 单元 → HTTP/进程集成 → 系统通知兜底端到端(mock D-Bus)
#       → SDK 构建/语义测试
#       → 三平台编译打包验证(缓存键与 release 一致,main 焐热缓存,发版直接命中)

name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '19 1 * * 3'
  workflow_dispatch:

# 同一分支的新推送自动取消仍在跑的旧运行(过期提交不占 runner)
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# 最小权限基线:各 job 按需覆盖(analyze 需 security-events)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # apt 包缓存:runner 一次性、系统层无留存,靠缓存归档免重复下载
      # 键带周数,每周自动换血对齐新版本
      - id: week
        run: echo "key=apt-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ steps.week.outputs.key }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ${{ steps.week.outputs.key }}-
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libfontconfig1-dev pkg-config dbus python3-dbus python3-gi
      # 最严格 clippy:lint 级别在 Cargo.toml [lints] 全 deny,这里再 -D warnings 兜底残留 rustc 告警
      - run: rustup component add clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # SDK 先于 release 构建:保证编译期内嵌的是真产物而非占位桩
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@10
      - run: cd sdk/js && pnpm install --silent && pnpm -F @hexinfo/x-notify-service-sdk build
      - run: cargo build --release
      - run: scripts/ci/test-api.sh
      - run: dbus-run-session -- scripts/ci/test-fallback.sh
      - run: cd sdk/js && pnpm -F @hexinfo/x-notify-service-sdk test

  # 三平台编译打包验证:与 release 的构建 job 同键共享缓存,
  # main 每次推送证明「可编可打包」,tag 发版直接命中热缓存
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 缓存键与 release.yml 各构建 job 完全一致(tag 回退取 main 缓存);
      # .ci-cache 与 target 拆开存(合并会因一方 tar 失败连坐全丢)
      - if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .ci-cache
          key: ${{ matrix.name }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.name }}-cargo-
      - if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: target/linux-${{ matrix.name == 'linux-x86_64' && 'x86_64' || 'aarch64' }}
          key: ${{ matrix.name }}-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.name }}-target-
      - if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: release-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@10
      - if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress && echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH
        shell: bash
      - if: runner.os == 'Linux'
        run: ./scripts/pack-linux.sh ${{ matrix.name == 'linux-x86_64' && 'x86_64' || 'aarch64' }}
      - if: runner.os == 'Windows'
        run: bash scripts/pack-windows.sh x86_64-pc-windows-msvc
        shell: bash
      # Windows 产物冒烟:GUI 子系统经 AttachConsole 回显到本控制台
      - if: runner.os == 'Windows'
        run: |
          ./target/x86_64-pc-windows-msvc/release/x-notify-service.exe --version
          ./target/x86_64-pc-windows-msvc/release/x-notify-service.exe info | head -5
        shell: bash

  # CodeQL 安全扫描(与 test 并行;安全标签页按 job 名识别,与独立工作流等效)
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
