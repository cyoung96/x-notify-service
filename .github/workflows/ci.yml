# CI:主分支只做测试检查(打包与发版只在 tag 流程,见 release.yml)
# 门禁:clippy 最严格检查 → 单元 → HTTP/进程集成 → 系统通知兜底端到端(mock D-Bus)
#       → Xvfb+Xfwm4 GUI 定位断言 → SDK 构建/语义测试

name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '19 1 * * 3'
  workflow_dispatch:

# 同一分支的新推送自动取消仍在跑的旧运行(过期提交不占 runner)
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# 最小权限基线:各 job 按需覆盖(analyze 需 security-events)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libfontconfig1-dev pkg-config dbus python3-dbus python3-gi xvfb xdotool libxkbcommon-x11-0 xfwm4 x11-utils
      # 最严格 clippy:lint 级别在 Cargo.toml [lints] 全 deny,这里再 -D warnings 兜底残留 rustc 告警
      - run: rustup component add clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # SDK 先于 release 构建:保证编译期内嵌的是真产物而非占位桩
      - run: npm install -g pnpm@10
      - run: cd sdk/js && pnpm install --silent && pnpm -F @hexinfo/x-notify-service-sdk build
      - run: cargo build --release
      - run: scripts/ci/test-api.sh
      - run: dbus-run-session -- scripts/ci/test-fallback.sh
      - run: scripts/ci/test-gui.sh
      - run: cd sdk/js && pnpm -F @hexinfo/x-notify-service-sdk test

  # CodeQL 安全扫描(与 test 并行;安全标签页按 job 名识别,与独立工作流等效)
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
