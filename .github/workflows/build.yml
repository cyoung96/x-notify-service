# GitHub Actions:打包三平台交付物
# 产物:Linux tgz(x86_64/aarch64)+ Windows NSIS setup.exe
# 说明:Linux 在 Debian 10 容器内编译(glibc 2.28 地板,兼容 UOS 20/麒麟 V10
#       等老 glibc 系统,产出可跑在 ≥2.28 的所有发行版);脚本自带 GLIBC 断言。
#       linux-aarch64 使用 GitHub 原生 arm64 runner(公开仓库免费;
#       私有仓库如无 arm64 配额,可改用 ubuntu-24.04 + docker/setup-qemu-action)

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ci-cache
          key: linux-x86_64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-x86_64-cargo-
      - run: npm install -g pnpm@10
      - run: ./scripts/pack-linux.sh x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-tgz
          path: dist/*.tar.gz

  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .ci-cache
          key: linux-aarch64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-aarch64-cargo-
      - run: npm install -g pnpm@10
      - run: ./scripts/pack-linux.sh aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-tgz
          path: dist/*.tar.gz

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 nsis
      - run: rustup target add x86_64-pc-windows-gnu
      - run: npm install -g pnpm@10
      - run: ./scripts/pack-windows.sh x86_64-pc-windows-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup-exe
          path: dist/*.exe

  # 全量测试:lint 门禁 → 单元 → HTTP/进程集成 → 系统通知兜底端到端(mock D-Bus)→ SDK 语义
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libfontconfig1-dev pkg-config dbus python3-dbus python3-gi xvfb xdotool libxkbcommon-x11-0 xfwm4 x11-utils
      # 最严格 clippy:lint 级别在 Cargo.toml [lints] 全 deny,这里再 -D warnings 兜底残留 rustc 告警
      - run: rustup component add clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - run: scripts/ci/test-api.sh
      - run: dbus-run-session -- scripts/ci/test-fallback.sh
      - run: scripts/ci/test-gui.sh
      - run: npm install -g pnpm@10
      - run: cd sdk/js && pnpm install --silent && pnpm -F @hexinfo/x-notify-service-sdk build && pnpm -F @hexinfo/x-notify-service-sdk test

  # 构建完成后自动发布到 Releases(资源列表):
  #   推 main → 更新滚动 latest;打 v* 标签 → 固定版本发布
  release:
    needs: [linux-x86_64, linux-aarch64, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="x-notify-service $TAG"
          else
            TAG="latest"
            TITLE="latest"
            gh release delete latest --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true
          fi
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "commit ${GITHUB_SHA::8} · $(date '+%Y-%m-%d %H:%M') CI 自动构建" \
            --target main \
            -R "$GITHUB_REPOSITORY" \
            dist/*.tar.gz dist/*.exe
        env:
          GH_TOKEN: ${{ github.token }}
