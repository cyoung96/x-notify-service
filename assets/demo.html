<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>x-notify-service 演示</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
      input { padding: 6px 10px; font-size: 14px; width: 100%; box-sizing: border-box; margin: 4px 0 12px; }
      button { padding: 6px 16px; font-size: 14px; cursor: pointer; }
      #log { margin-top: 16px; color: #86909c; font-size: 13px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h2>通知演示</h2>
    <p id="status">检测中…</p>
    <label>标题<input id="title" value="工单提醒" /></label>
    <label>正文(HTML 子集)<input id="body" value="&lt;b&gt;张三&lt;/b&gt; 提交了 &lt;font color=&quot;#d93025&quot;&gt;紧急&lt;/font&gt; 归档申请" /></label>
    <button id="send">发送</button>
    <button id="close">关闭弹窗</button>
    <div id="log"></div>

    <script type="module">
      import { createNotifyService } from './sdk.js'
      const svc = createNotifyService()
      const log = (m) => { document.getElementById('log').textContent += m + '\n' }

      svc.start().then((ok) => {
        document.getElementById('status').textContent = ok ? '服务在线' : '服务未运行(发送将静默失败)'
      })

      document.getElementById('send').onclick = async () => {
        const r = await svc.notify({
          title: title.value,
          body: body.value,
        })
        log(r.ok ? `已发送(via=${r.via})` : '未送达:服务未运行')
      }
      document.getElementById('close').onclick = async () => {
        await svc.close()
        log('已关闭')
      }
    </script>
  </body>
</html>
